name: Release
# A tag publishes a release. "Run workflow" (manual) only tests and builds, to look at the installers and the updater files
# (the log of each build prints them) without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the package.json version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:windows
          - os: ubuntu-latest
            script: build:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - name: Check latest.yml offers only the Setup installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! grep -q "Xenia-Dashboard-${version}-Setup.exe" dist/latest.yml; then
            echo "::error::dist/latest.yml does not list the Setup installer"
            exit 1
          fi
          if grep -q -- "-Portable.exe" dist/latest.yml; then
            echo "::error::dist/latest.yml lists the Portable build; the updater must never offer it"
            exit 1
          fi
      - name: Show the updater files
        shell: bash
        run: |
          for f in dist/latest*.yml; do echo "=== $f"; cat "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "Xenia Dashboard ${GITHUB_REF_NAME#v}" --generate-notes
